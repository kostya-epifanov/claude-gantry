name: validate

on:
  push:
    branches: [master]
    tags: ['*--v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run the verification suite
        run: bash scripts/verify.sh

  # The body is the reviewer's interface to the change, and GitHub renders it in
  # comment mode — a single newline inside a paragraph becomes a <br>. Every
  # markdown file in this repository is hard-wrapped at 100 columns, so a body
  # written in the same habit arrives as a ragged column. Nine of the first
  # sixteen pull requests here shipped that way before anybody noticed.
  #
  # It runs only on a pull request, because that is the only event that carries
  # a body. `env:` rather than interpolation: a body is attacker-controlled text
  # and must never be pasted into a shell script.
  pr-body-renders-as-prose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | bash scripts/check_pr_body.sh -

  # A release and its manifest must not be able to disagree. The tag is what
  # people install; plugin.json's version is what the plugin reports about
  # itself, and a mismatch between them is invisible until someone is debugging
  # the wrong version.
  #
  # The tag is `gantry--v0.5.0`, not `v0.5.0`: that is the shape `claude plugin
  # tag` writes, and it is the only shape worth checking, because a release cut
  # any other way is a release cut by hand. The `{plugin}--v{version}` prefix is
  # what lets one repository carry more than one plugin without its tags
  # colliding — this one carries a single plugin, but the format is the
  # toolchain's, not ours to redefine.
  tag-matches-manifest:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '--v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag against plugin.json
        run: |
          name="${GITHUB_REF_NAME%%--v*}"
          tag="${GITHUB_REF_NAME##*--v}"
          manifest="$(jq -r '.version' .claude-plugin/plugin.json)"
          declared="$(jq -r '.name' .claude-plugin/plugin.json)"
          echo "tag=$name $tag manifest=$declared $manifest"
          if [ "$name" != "$declared" ]; then
            echo "::error::tag names plugin $name, plugin.json declares $declared"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $manifest"
            exit 1
          fi
