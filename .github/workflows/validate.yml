name: validate

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run the verification suite
        run: bash scripts/verify.sh

  # A release and its manifest must not be able to disagree. The tag is what
  # people install; plugin.json's version is what the plugin reports about
  # itself, and a mismatch between them is invisible until someone is debugging
  # the wrong version.
  tag-matches-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag against plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r '.version' .claude-plugin/plugin.json)"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match plugin.json version $manifest"
            exit 1
          fi
